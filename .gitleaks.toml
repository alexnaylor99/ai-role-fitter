# gitleaks: default rules plus a narrow allowlist of known false positives.
[extend]
useDefault = true

[allowlist]
description = "Known false positives (not secrets)"
paths = [
  # detect-secrets' own baseline: stores hashes of already-reviewed false positives
  '''^\.secrets\.baseline$''',
]
regexes = [
  # ElevenLabs' public default voice ID (a voice name, not a credential)
  '''JBFqnCBsd6RMkjVDRZzb''',
]
